name: Test

on:
  push:
    branches:
      - master
  pull_request:

jobs:      
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install
        run: pnpm install --ignore-scripts --prefer-offline
      - name: Linting files
        run: pnpm lint
      - name: Build package
        run: pnpm build
      - name: Check built entry points
        run: |
          node -e "const plugin = require('.'); if (typeof plugin !== 'function') throw new Error('require() did not return a plugin function')"
          node --input-type=module -e "const { default: plugin } = await import('postcss-rtlcss'); if (typeof plugin !== 'function') throw new Error('import() did not return a plugin function')"
      - name: Test playground build
        run: pnpm playground:build
      - name: Make coverage
        run: pnpm test --coverage
      - name: Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}